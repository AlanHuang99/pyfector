name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        uses: astral-sh/setup-uv@v6

      - name: Sync test dependencies
        run: uv sync --locked --extra dev --group dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: |
          uv run --no-sync pytest tests/test_linalg.py tests/test_smoke.py tests/test_robust.py tests/test_stress.py tests/test_bootstrap_se.py tests/test_cv_folds_perf.py tests/test_ledger_fixes.py tests/test_docs.py -v -k "not very_large and not slow"
