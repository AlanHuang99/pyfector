name: Build & Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        uses: astral-sh/setup-uv@v6

      - name: Build wheel and sdist
        run: uv build

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # pyfector is pure Python — one wheel works on all platforms.
  # No need for cibuildwheel or platform-specific builds.
  # The py3-none-any wheel is universal.
  verify:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Verify installed wheel
        shell: bash
        env:
          PYFECTOR_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          for wheel in dist/*.whl; do
            uv run --isolated --no-project --python "${{ matrix.python-version }}" --with "$wheel" python -I -c '
          import os
          from importlib.metadata import version
          import pyfector
          assert pyfector.__version__ == version("pyfector")
          expected = os.environ.get("PYFECTOR_RELEASE_TAG", "").removeprefix("v")
          if expected:
              assert pyfector.__version__ == expected
          print(f"pyfector {pyfector.__version__}, device={pyfector.get_device()}")
          '
          done

  upload-release:
    needs: [build, verify]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber --repo "${{ github.repository }}"

  publish-pypi:
    needs: [build, verify]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/pyfector
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: false
